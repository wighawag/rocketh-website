# Checks a change to the site against the rocketh content it renders.
#
# This repository has no content of its own: it is built against a rocketh
# checkout, laid out as a sibling exactly as it is locally and in rocketh's
# deploy workflow. By default that is rocketh's `main`, which is what the next
# deploy would publish. `workflow_dispatch` takes another rocketh ref, to check
# the site against a rocketh branch that is not merged yet.
#
# Deployment is NOT here: rocketh.dev is GitHub Pages of the rocketh
# repository, and its deploy workflow pins the commit of this one it builds.

name: verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rocketh-ref:
        description: 'rocketh ref (branch, tag or commit) to build against'
        required: false
        default: main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rocketh-website
          persist-credentials: false

      - name: Checkout rocketh (the content)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wighawag/rocketh
          ref: ${{ inputs.rocketh-ref || 'main' }}
          path: rocketh
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            rocketh/pnpm-lock.yaml
            rocketh-website/pnpm-lock.yaml

      - name: Build the playground in rocketh
        working-directory: rocketh
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
          pnpm docs:widgets

      - name: Install the site
        working-directory: rocketh-website
        run: pnpm i --frozen-lockfile

      - name: Check, test, format
        working-directory: rocketh-website/web
        run: |
          pnpm check
          pnpm test
          pnpm format:check

      - name: Install the e2e browser
        working-directory: rocketh-website/web
        run: pnpm exec playwright install --with-deps chromium

      # Builds the site (dead links and missing anchors fail it), then drives it.
      - name: Build and end-to-end tests
        working-directory: rocketh-website/web
        run: pnpm test:e2e
